{{- if .Values.mariadb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "piwigo.mariadb.fullname" . }}
  labels:
    {{- include "piwigo.mariadb.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "piwigo.mariadb.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "piwigo.mariadb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "piwigo.mariadb.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: mariadb
        image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
        imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
        env:
        - name: MARIADB_RANDOM_ROOT_PASSWORD
          value: "{{ .Values.mariadb.auth.randomRootPassword }}"
        - name: MARIADB_USER
          value: "{{ .Values.mariadb.auth.username }}"
        - name: MARIADB_PASSWORD
          value: "{{ .Values.mariadb.auth.password }}"
        - name: MARIADB_DATABASE
          value: "{{ .Values.mariadb.auth.database }}"
        - name: TZ
          value: "{{ .Values.mariadb.timezone }}"
        ports:
        - name: mysql
          containerPort: 3306
          protocol: TCP
        {{- if .Values.mariadb.persistence.enabled }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        {{- end }}
      {{- if .Values.mariadb.persistence.enabled }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "piwigo.mariadb.fullname" . }}
      {{- end }}
{{- end }}
